# Publishes marimo-banners to PyPI every time a `vX.Y.Z` tag is pushed.
#
# Publishing uses Trusted Publishing: PyPI trusts the OIDC token that GitHub
# issues for this workflow, so no API tokens are stored in secrets.
# For this to work, the project owner on PyPI registers the publisher once at
# https://pypi.org/manage/project/marimo-banners/settings/publishing/
# with these values:
#   Owner: kascesar · Repository: banners · Workflow: release.yml · Environment: pypi
#
# Tags containing `rc` (for example `v0.2.3rc1`) are published to TestPyPI instead
# of PyPI. For that, the same publisher is registered, with the same values, at
# https://test.pypi.org/manage/project/marimo-banners/settings/publishing/
# (if the project does not exist on TestPyPI yet, register it as a "pending publisher").
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub environment the PyPI publisher is registered with; GitHub creates it
    # automatically on the first run if it does not exist.
    environment: pypi
    permissions:
      # Required for GitHub to issue the OIDC token used by Trusted Publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The tag without the `v` must match `project.version` in pyproject.toml;
      # otherwise the job fails before building anything.
      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to TestPyPI
        if: contains(github.ref_name, 'rc')
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        run: uv publish --trusted-publishing always
