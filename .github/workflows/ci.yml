# Continuous integration: runs the linter (ruff) and the unit tests (pytest)
# on every push and every pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # false: if one Python version fails, the others keep running and each
      # result is reported.
      fail-fast: false
      matrix:
        # Minimum supported version (requires-python = ">=3.11") and a recent one.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Installs uv and pins the matrix Python version for the following steps.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Installs only the base dependencies from uv.lock, without extras. The `dev`
      # extra includes manim, which needs system libraries (cairo, pango) and is not
      # used here. --locked fails if uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # ruff is added for this command only with --with, without touching uv.lock.
      - name: Ruff
        run: uv run --with ruff ruff check banners tests

      # pytest is added the same way as ruff. Tests marked `manim` are skipped
      # (addopts in pyproject.toml). pandas and plotly are not library
      # dependencies, but the notebooks run by tests/test_notebooks.py import them
      # (test/06_table.py, test/07_plot.py).
      - name: Pytest
        run: uv run --with pytest --with pandas --with plotly pytest

  # Builds the documentation site on every push and pull request, so a broken
  # page or configuration fails here and not when the site is published.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the site
        run: quarto render site
