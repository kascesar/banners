[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-banners"
version = "0.2.2"
description = "Presentaciones composables para marimo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9.0",
    "anywidget>=0.9.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev   = ["hatch", "pdoc", "pandas", "manim", "ruff", "pytest", "pytest-cov"]
manim = ["manim"]
[project.urls]
Homepage = "https://github.com/kascesar/banners"
Repository = "https://github.com/kascesar/banners"

[tool.hatch.build.targets.wheel]
packages = ["banners"]

# Linter. Se ejecuta con `uv run ruff check banners`.
[tool.ruff]
# Largo máximo de línea; las líneas más largas se reportan como error.
line-length = 100
# Versión mínima de Python soportada; ruff no sugiere sintaxis más nueva que esta.
target-version = "py310"

[tool.ruff.lint]
# Reglas desactivadas. RUF022 ordenaría alfabéticamente los `__all__`, pero pdoc
# usa ese orden para la documentación y los `__all__` están agrupados a propósito.
ignore = ["RUF022"]

[tool.ruff.lint.isort]
# true: `from x import a, b as c` queda en un solo bloque; false: ruff separa cada
# import con alias en su propio `from x import (...)`.
combine-as-imports = true

# Pruebas unitarias. Se ejecutan con `uv run pytest`.
[tool.pytest.ini_options]
# Carpeta con las pruebas pytest; `test/` contiene notebooks de marimo y no se recorre.
testpaths = ["tests"]
# "-m 'not manim'" omite por defecto las pruebas que necesitan manim y las librerías
# del sistema; `uv run pytest -m manim` ejecuta solo esas.
addopts = "-m 'not manim'"
# Marcas declaradas; pytest falla con una marca no listada aquí.
markers = ["manim: requiere manim y las librerías del sistema (cairo, pango, ffmpeg)"]
