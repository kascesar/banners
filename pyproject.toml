[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-banners"
version = "0.5.0"
description = "Composable presentations for marimo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9.0",
    "anywidget>=0.9.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev   = ["hatch", "pdoc", "pandas", "manim", "ruff", "pytest", "pytest-cov"]
manim = ["manim"]
[project.urls]
Homepage = "https://github.com/kascesar/banners"
Repository = "https://github.com/kascesar/banners"

[tool.hatch.build.targets.wheel]
packages = ["banners"]

# Linter. Run it with `make lint`.
[tool.ruff]
# Maximum line length; longer lines are reported as errors.
line-length = 100
# Minimum supported Python version; ruff does not suggest syntax newer than this.
target-version = "py310"

[tool.ruff.lint]
# Disabled rules. RUF022 would sort `__all__` alphabetically, but pdoc uses that
# order for the documentation and `__all__` is grouped on purpose.
ignore = ["RUF022"]

[tool.ruff.lint.isort]
# true: `from x import a, b as c` stays in one statement; false: ruff splits every
# aliased import into its own `from x import (...)`.
combine-as-imports = true

# Unit tests. Run them with `make test`.
[tool.pytest.ini_options]
# Folder with the pytest tests; `test/` holds marimo notebooks and is not collected.
testpaths = ["tests"]
# "-m 'not manim'" skips by default the tests that need manim and the system
# libraries; `uv run pytest -m manim` runs only those.
addopts = "-m 'not manim'"
# Declared markers; pytest fails on a marker not listed here.
markers = ["manim: needs manim and the system libraries (cairo, pango, ffmpeg)"]
